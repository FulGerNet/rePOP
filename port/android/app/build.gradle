plugins {
    id "com.android.application"
}

// The repository root: the logo, the launcher's face and SDL's Java half
// come from there, as the native half does (../CMakeLists.txt).
def root = new File(rootDir, "../..").canonicalFile
def sdlJava = new File(root, "build/deps/sdl-source/SDL3-3.4.18/android-project/app/src/main/java")
def python = System.getenv("RESOT_PYTHON") ?: "python"
def generatedAssets = new File(buildDir, "generated/resot-assets")

android {
    namespace "com.fulger.resot"
    compileSdk 36
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.fulger.resot"
        minSdk 29
        targetSdk 36
        versionCode 10
        versionName "0.4.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-29", "-DRESOT_PYTHON=" + python
                targets "SDL3-shared", "resot_launcher", "resot_demo", "resot_retail", "main_hook", "file_redirect_hook", "gsl_alloc_hook", "hook_impl"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
            version "3.30.3"
        }
    }

    sourceSets {
        main {
            java.srcDirs += sdlJava
            assets.srcDirs += generatedAssets
        }
    }

    buildTypes {
        debug {
            // The lifted code is far too slow without optimisation; the
            // native targets set -O2 themselves (../CMakeLists.txt).
            jniDebuggable true
        }
        release {
            minifyEnabled false
            // Preserve the existing publisher identity so installed APKs can
            // update in place. build-android.ps1 checks its public pin before
            // packaging. Never silently regenerate/replace this private key.
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources.excludes += ["META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"]
        jniLibs {
            // libadrenotools needs hooks in ApplicationInfo.nativeLibraryDir.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Verify the complete installed APK with Android's maintained verifier.
    implementation "com.android.tools.build:apksig:9.0.1"
}

// The launcher's logo (docs/media/reSOT_logo.png), its Prince of Persia title
// in two layers (port/windows/res/launcher_title_letters.png and the sand
// behind them, launcher_title_sand.png, which LauncherView animates) and, when
// present, the Atlantis MF
// face (port/windows/res/AtlantisMF.ttf; see docs/LICENSING.md) -- the same
// files the Windows launcher embeds.
tasks.register("resotAssets", Copy) {
    from(new File(root, "port/android/default-options.ini")) { rename { "resot-options.ini" } }
    from(new File(root, "docs/media")) { include "reSOT_logo.png" }
    from(new File(root, "port/windows/res")) {
        include "AtlantisMF.ttf", "launcher_title_letters.png", "launcher_title_sand.png"
    }
    // The notices binary redistributions must carry (docs/LICENSING.md).
    from(new File(root, "port/third_party/extract-xiso/LICENSE.TXT")) {
        into "licenses"; rename { "LICENSE-extract-xiso.txt" }
    }
    from(new File(root, "build/deps/sdl-source/SDL3-3.4.18/LICENSE.txt")) {
        into "licenses"; rename { "LICENSE-SDL3.txt" }
    }
    from(new File(root, "LICENSE")) { into "licenses"; rename { "LICENSE-reSOT.txt" } }
    from(new File(root, "port/third_party/apksig/LICENSE")) {
        into "licenses"; rename { "LICENSE-apksig.txt" }
    }
    from(new File(root, "port/third_party/xboxrecomp/LICENSE")) {
        into "licenses"; rename { "LICENSE-xboxrecomp.txt" }
    }
    from(new File(root, "port/third_party/xboxrecomp/NOTICE")) {
        into "licenses"; rename { "NOTICE-xboxrecomp.txt" }
    }
    from(new File(root, "build/deps/libadrenotools/LICENSE")) {
        into "licenses"; rename { "LICENSE-libadrenotools.txt" }
    }
    from(new File(root, "build/deps/libadrenotools/lib/linkernsbypass/LICENSE")) {
        into "licenses"; rename { "LICENSE-liblinkernsbypass.txt" }
    }
    from(new File(root, "build/deps/glslang/LICENSE.txt")) {
        into "licenses"; rename { "LICENSE-glslang.txt" }
    }
    from(new File(root, "build/deps/spirv-tools/LICENSE")) {
        into "licenses"; rename { "LICENSE-SPIRV-Tools.txt" }
    }
    from(new File(root, "build/deps/spirv-headers/LICENSE")) {
        into "licenses"; rename { "LICENSE-SPIRV-Headers.txt" }
    }
    into generatedAssets
}
tasks.named("preBuild") { dependsOn "resotAssets" }
